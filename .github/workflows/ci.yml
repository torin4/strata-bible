name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@9.15.0). Do not also set
      # `version` here: pnpm/action-setup@v4 errors with ERR_PNPM_BAD_PM_VERSION if both exist.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Biome
        run: pnpm lint

      - name: Tailwind arbitrary guard
        run: pnpm lint:tailwind-arbitrary

      - name: Tests
        run: pnpm test

      - name: Validate content
        run: pnpm validate-content

      - name: Content density
        run: pnpm check-density

      - name: Next build smoke
        run: pnpm build
